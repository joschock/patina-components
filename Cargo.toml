[workspace]
resolver = "3"
members = ["uefi_hid", "usb_hid"]

[workspace.package]
version = "0.0.1"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.89"
description = "Patina components"
repository = "https://github.com/OpenDevicePartnership/patina-components"

[workspace.dependencies]
hidparser = { version = "1" }
log = { version = "0.4", default-features = false }
mockall = { version = "0.13.0" }
num_enum = { version = "0.7", default-features = false }
# git path is a temporary placeholder until the appropriate protocol branches are checked in upstream.
patina = { git = "https://github.com/joschock/patina", branch = "usb_hid_protocol_defs" }
r-efi = { version = "7", default-features = false }
scroll = { version = "0.13", default-features = false, features = ["derive"] }

# Local patina tree override for development. Build is expected to fail until
# integration code is updated to match the local tree.
[patch."https://github.com/joschock/patina"]
patina = { path = "/home/schock/patina/sdk/patina" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Profile used to build workspace dependencies for `mdbook test`. Inherits from `dev`
# but disables LTO so that the resulting rlibs contain machine code and can be linked
# by `rustdoc --test` when running the doctests embedded in the mdbook.
[profile.mdbook]
inherits = "dev"
lto = false
